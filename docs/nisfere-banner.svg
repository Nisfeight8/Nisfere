<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgFade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161d"/>
      <stop offset="100%" stop-color="#0e0f14"/>
    </linearGradient>
    <linearGradient id="swatchGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3c0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7dd3c0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgFade)"/>

  <!-- Subtle tiled-window grid motif — a nod to Hyprland's own tiling layout, kept quiet and structural, not decorative -->
  <g stroke="#ffffff" stroke-opacity="0.05" fill="none">
    <rect x="640" y="40" width="240" height="150" rx="6"/>
    <rect x="892" y="40" width="220" height="72" rx="6"/>
    <rect x="892" y="120" width="220" height="70" rx="6"/>
    <rect x="640" y="202" width="150" height="70" rx="6"/>
    <rect x="802" y="202" width="150" height="70" rx="6"/>
    <rect x="964" y="202" width="148" height="70" rx="6"/>
  </g>

  <!-- Eyebrow: frames the swatch strip below as literally "extracted from a wallpaper" -->
  <text x="84" y="196" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="13" fill="#6f7280" letter-spacing="0.5">$ theme --from-wallpaper</text>

  <!-- Wordmark, with a blinking terminal caret as part of the same text flow (not a separately-positioned element, which drifted out of alignment depending on font metrics) -->
  <text x="80" y="140" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="72" font-weight="700" letter-spacing="1" fill="#eae6da">nisfer<tspan fill="#7dd3c0">e</tspan><tspan id="caret" fill="#7dd3c0" dx="6">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.6s" repeatCount="indefinite"/>▏</tspan></text>

  <!-- Tagline -->
  <text x="82" y="176" font-family="-apple-system,'Segoe UI',sans-serif" font-size="19" fill="#9a9ba3">A Hyprland desktop shell for developers</text>

  <!-- Palette swatch strip — the signature element: colors a wallpaper would actually produce, in this shell's own theme-JSON order -->
  <g transform="translate(84 214)">
    <rect x="-10" y="-10" width="336" height="44" fill="url(#swatchGlow)"/>
    <rect x="0"  y="0" width="24" height="24" rx="5" fill="#7dd3c0"/>
    <rect x="34" y="0" width="24" height="24" rx="5" fill="#f2a65a"/>
    <rect x="68" y="0" width="24" height="24" rx="5" fill="#e85d75"/>
    <rect x="102" y="0" width="24" height="24" rx="5" fill="#6ea8fe"/>
    <rect x="136" y="0" width="24" height="24" rx="5" fill="#c792ea"/>
    <rect x="170" y="0" width="24" height="24" rx="5" fill="#96e072"/>
    <rect x="204" y="0" width="24" height="24" rx="5" fill="#e2c14c"/>
    <rect x="238" y="0" width="24" height="24" rx="5" fill="#eae6da"/>
  </g>

  <!-- Corner tag -->
  <text x="1116" y="272" text-anchor="end" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="13" fill="#4d4f5a" letter-spacing="0.5">quickshell + hyprland</text>
</svg>
